# Compain: app + PostgreSQL. Secrets come from .env (never committed).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: compain
      POSTGRES_USER: compain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - compain-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compain -d compain"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    # Build on every "docker compose up", so after "git pull" the new code runs (unchanged layers come from the cache).
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      COMPAIN_DB_URL: postgresql+psycopg://compain:${POSTGRES_PASSWORD}@db:5432/compain
      COMPAIN_SECRET_KEY: ${COMPAIN_SECRET_KEY:?set COMPAIN_SECRET_KEY in .env}
      COMPAIN_ADMIN_USERNAME: ${COMPAIN_ADMIN_USERNAME:-admin}
      COMPAIN_ADMIN_PASSWORD: ${COMPAIN_ADMIN_PASSWORD:?set COMPAIN_ADMIN_PASSWORD in .env}
      COMPAIN_MODEL_BASE_URL: ${COMPAIN_MODEL_BASE_URL:-http://llm:8081/v1}
      COMPAIN_MODEL_NAME: ${COMPAIN_MODEL_NAME:-gemma-4-26b-a4b}
      COMPAIN_MODEL_DEVICE: ${LLM_DEVICE:-cpu}
      COMPAIN_HOSTED_API_BASE_URL: ${COMPAIN_HOSTED_API_BASE_URL:-mock}
      COMPAIN_HOSTED_API_KEY: ${COMPAIN_HOSTED_API_KEY:-}
      COMPAIN_HOSTED_MODEL: ${COMPAIN_HOSTED_MODEL:-llama-3.1-8b-instant}
    volumes:
      - compain-data:/srv/app/data
      # Impressum: create it once with  cp .impressum-example .impressum  and fill in your data.
      - type: bind
        source: ./.impressum
        target: /srv/app/legal/impressum
        read_only: true
        bind:
          create_host_path: false
      # Datenschutzerklärung: create it once with  cp .datenschutz-example .datenschutz  and adapt it.
      - type: bind
        source: ./.datenschutz
        target: /srv/app/legal/datenschutz
        read_only: true
        bind:
          create_host_path: false
      # Second place for backups (for example a mounted NAS or USB disk). Set BACKUP_OFFSITE_DIR in .env.
      - ${BACKUP_OFFSITE_DIR:-./offsite-backups}:/srv/app/offsite
    ports:
      - "8080:8080"

  # Self-hosted model server (llama.cpp, OpenAI-compatible), always started with the app.
  # On the first start it downloads the model into ./models (about 17 GB, resumes if interrupted).
  # LLM_MODEL in .env: gemma (default), mistral, or none for no self-hosted model.
  # It runs on the processor. For an NVIDIA graphics card add docker-compose.gpu.yml (./scripts/llm.sh gpu).
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/llm-start.sh"]
    environment:
      LLM_MODEL: ${LLM_MODEL:-gemma}
      LLM_CONTEXT: ${LLM_CONTEXT:-16384}
      LLM_SLOTS: ${LLM_SLOTS:-2}
      LLM_THREADS: ${LLM_THREADS:-6}
    volumes:
      - ./models:/models
      - ./scripts/llm-start.sh:/scripts/llm-start.sh:ro
      - ./scripts/models.sh:/scripts/models.sh:ro
    networks:
      default:
        # older .env files point to http://llm-gemma:8081/v1 or http://llm-mistral:8081/v1
        aliases: [llm-gemma, llm-mistral]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # HTTPS in front of the app. Start with: docker compose --profile https up -d
  # Needs COMPAIN_DOMAIN in .env (a domain pointing to this server) and ports 80 and 443 open.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      COMPAIN_DOMAIN: ${COMPAIN_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  compain-db:
  compain-data:
  caddy-data:
