# Compain: app + PostgreSQL. Secrets come from .env (never committed).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: compain
      POSTGRES_USER: compain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - compain-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compain -d compain"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      COMPAIN_DB_URL: postgresql+psycopg://compain:${POSTGRES_PASSWORD}@db:5432/compain
      COMPAIN_SECRET_KEY: ${COMPAIN_SECRET_KEY:?set COMPAIN_SECRET_KEY in .env}
      COMPAIN_ADMIN_USERNAME: ${COMPAIN_ADMIN_USERNAME:-admin}
      COMPAIN_ADMIN_PASSWORD: ${COMPAIN_ADMIN_PASSWORD:?set COMPAIN_ADMIN_PASSWORD in .env}
      COMPAIN_MODEL_BASE_URL: ${COMPAIN_MODEL_BASE_URL:-mock}
      COMPAIN_MODEL_NAME: ${COMPAIN_MODEL_NAME:-mistral-small-3.2}
      COMPAIN_HOSTED_API_BASE_URL: ${COMPAIN_HOSTED_API_BASE_URL:-mock}
      COMPAIN_HOSTED_API_KEY: ${COMPAIN_HOSTED_API_KEY:-}
      COMPAIN_HOSTED_MODEL: ${COMPAIN_HOSTED_MODEL:-llama-3.1-8b-instant}
    volumes:
      - compain-data:/srv/app/data
    ports:
      - "8080:8080"

  # Self-hosted model servers (llama.cpp, OpenAI-compatible). Start one with its profile:
  #   docker compose --profile llm-mistral up -d
  # and set COMPAIN_MODEL_BASE_URL=http://llm-mistral:8081/v1 in .env.
  llm-mistral:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm-mistral"]
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    command: ["-m", "/models/mistral-small-3.2-abliterated-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8081", "-c", "8192", "-t", "${LLM_THREADS:-6}"]

  llm-gemma:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm-gemma"]
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    command: ["-m", "/models/gemma-4-26b-a4b-uncensored-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8081", "-c", "8192", "-t", "${LLM_THREADS:-6}"]

  # HTTPS in front of the app. Start with: docker compose --profile https up -d
  # Needs COMPAIN_DOMAIN in .env (a domain pointing to this server) and ports 80 and 443 open.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      COMPAIN_DOMAIN: ${COMPAIN_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  compain-db:
  compain-data:
  caddy-data:
