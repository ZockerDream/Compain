# Compain: app + PostgreSQL. Secrets come from .env (never committed).

# Shared settings of the self-hosted model servers (see the llm-* services below).
x-llm-cpu: &llm-cpu
  image: ghcr.io/ggml-org/llama.cpp:server
  restart: unless-stopped
  volumes:
    - ./models:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 120s

x-llm-gpu: &llm-gpu
  <<: *llm-cpu
  image: ghcr.io/ggml-org/llama.cpp:server-cuda
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: compain
      POSTGRES_USER: compain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - compain-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compain -d compain"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      COMPAIN_DB_URL: postgresql+psycopg://compain:${POSTGRES_PASSWORD}@db:5432/compain
      COMPAIN_SECRET_KEY: ${COMPAIN_SECRET_KEY:?set COMPAIN_SECRET_KEY in .env}
      COMPAIN_ADMIN_USERNAME: ${COMPAIN_ADMIN_USERNAME:-admin}
      COMPAIN_ADMIN_PASSWORD: ${COMPAIN_ADMIN_PASSWORD:?set COMPAIN_ADMIN_PASSWORD in .env}
      COMPAIN_MODEL_BASE_URL: ${COMPAIN_MODEL_BASE_URL:-mock}
      COMPAIN_MODEL_NAME: ${COMPAIN_MODEL_NAME:-mistral-small-3.2}
      COMPAIN_MODEL_DEVICE: ${LLM_DEVICE:-cpu}
      COMPAIN_HOSTED_API_BASE_URL: ${COMPAIN_HOSTED_API_BASE_URL:-mock}
      COMPAIN_HOSTED_API_KEY: ${COMPAIN_HOSTED_API_KEY:-}
      COMPAIN_HOSTED_MODEL: ${COMPAIN_HOSTED_MODEL:-llama-3.1-8b-instant}
    volumes:
      - compain-data:/srv/app/data
      # Impressum: create it once with  cp .impressum-example .impressum  and fill in your data.
      - type: bind
        source: ./.impressum
        target: /srv/app/legal/impressum
        read_only: true
        bind:
          create_host_path: false
      # Datenschutzerklärung: create it once with  cp .datenschutz-example .datenschutz  and adapt it.
      - type: bind
        source: ./.datenschutz
        target: /srv/app/legal/datenschutz
        read_only: true
        bind:
          create_host_path: false
      # Second place for backups (for example a mounted NAS or USB disk). Set BACKUP_OFFSITE_DIR in .env.
      - ${BACKUP_OFFSITE_DIR:-./offsite-backups}:/srv/app/offsite
    ports:
      - "8080:8080"

  # Self-hosted model servers (llama.cpp, OpenAI-compatible). Pick model and device with
  #   ./scripts/llm.sh gpu gemma      (or: cpu gemma, gpu mistral, cpu mistral)
  # The script sets COMPOSE_PROFILES and LLM_DEVICE in .env and restarts the model server.
  # The GPU variants need an NVIDIA card and the NVIDIA Container Toolkit; llama.cpp puts as much of
  # the model into the graphics memory as fits (--fit) and keeps the rest in RAM. Both variants of a
  # model answer under the same name (llm-gemma, llm-mistral), so COMPAIN_MODEL_BASE_URL stays the same.
  llm-mistral:
    <<: *llm-cpu
    profiles: ["llm-mistral"]
    command: ["-m", "/models/mistral-small-3.2-abliterated-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8081", "-c", "${LLM_CONTEXT:-16384}", "-np", "${LLM_SLOTS:-2}", "-t", "${LLM_THREADS:-6}", "--reasoning", "off"]

  llm-mistral-gpu:
    <<: *llm-gpu
    profiles: ["llm-mistral-gpu"]
    networks:
      default:
        aliases: [llm-mistral]
    command: ["-m", "/models/mistral-small-3.2-abliterated-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8081", "-c", "${LLM_CONTEXT:-16384}", "-np", "${LLM_SLOTS:-2}", "-t", "${LLM_THREADS:-6}", "--reasoning", "off", "--fit-target", "${LLM_GPU_RESERVE_MB:-1024}"]

  llm-gemma:
    <<: *llm-cpu
    profiles: ["llm-gemma"]
    command: ["-m", "/models/gemma-4-26b-a4b-uncensored-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8081", "-c", "${LLM_CONTEXT:-16384}", "-np", "${LLM_SLOTS:-2}", "-t", "${LLM_THREADS:-6}", "--reasoning", "off"]

  llm-gemma-gpu:
    <<: *llm-gpu
    profiles: ["llm-gemma-gpu"]
    networks:
      default:
        aliases: [llm-gemma]
    command: ["-m", "/models/gemma-4-26b-a4b-uncensored-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8081", "-c", "${LLM_CONTEXT:-16384}", "-np", "${LLM_SLOTS:-2}", "-t", "${LLM_THREADS:-6}", "--reasoning", "off", "--fit-target", "${LLM_GPU_RESERVE_MB:-1024}"]

  # HTTPS in front of the app. Start with: docker compose --profile https up -d
  # Needs COMPAIN_DOMAIN in .env (a domain pointing to this server) and ports 80 and 443 open.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      COMPAIN_DOMAIN: ${COMPAIN_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  compain-db:
  compain-data:
  caddy-data:
